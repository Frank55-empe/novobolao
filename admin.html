<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrador — Bolão da Mega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mesa: #0b3d2b;
    --verde: #0f7b4f;
    --verde-claro: #dcefe4;
    --tinta: #062a1d;
    --papel: #f3faf5;
    --linha: #9cc7b0;
    --ouro: #f2c230;
    --erro: #b3261e;
    --fonte-titulo: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --fonte-texto: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--mesa); color: var(--tinta); font-family: var(--fonte-texto); font-size: 16px; line-height: 1.45; padding: 16px 12px 40px; }
  .painel { max-width: 560px; margin: 0 auto; background: var(--papel); border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .topo { background: var(--verde); color: #fff; padding: 18px; border-bottom: 6px solid var(--ouro); }
  .topo h1 { margin: 0; font-family: var(--fonte-titulo); font-size: 40px; line-height: 1; }
  .topo p { margin: 6px 0 0; font-size: 15px; }
  section { padding: 18px; border-bottom: 2px dashed var(--linha); }
  section:last-of-type { border-bottom: 0; }
  h2 { margin: 0 0 12px; font-family: var(--fonte-titulo); font-size: 24px; color: var(--verde); }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .campo { margin-bottom: 14px; }
  input[type=text], input[type=password], input[type=date] { width: 100%; padding: 12px; font: inherit; border: 2px solid var(--linha); border-radius: 4px; background: #fff; color: var(--tinta); }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
  input:focus { border-color: var(--verde); }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cabecalho-grade { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .contador { font-family: var(--fonte-titulo); font-size: 26px; }
  .contador.cheio { color: var(--verde); }
  .grade { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .dezena { aspect-ratio: 3 / 4; min-width: 0; padding: 0; font-family: var(--fonte-texto); font-weight: 600; font-size: clamp(11px, 3.2vw, 16px); color: var(--verde); background: var(--verde-claro); border: 1.5px solid var(--linha); border-radius: 3px; cursor: pointer; touch-action: manipulation; }
  .dezena[aria-pressed=true] { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .acoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button.btn { font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 4px; border: 2px solid var(--verde); background: transparent; color: var(--verde); cursor: pointer; }
  button.btn.principal { width: 100%; background: var(--verde); color: #fff; font-size: 18px; padding: 15px; }
  button.btn.perigo { color: var(--erro); border-color: var(--erro); }
  button.btn:disabled { opacity: .55; cursor: wait; }
  .msg { min-height: 1.4em; margin: 10px 0 0; font-weight: 600; }
  .msg.erro { color: var(--erro); }
  .msg.ok { color: var(--verde); }
  .aviso { font-size: 14px; margin: 8px 0 0; opacity: .85; }
  .banner { background: var(--ouro); padding: 10px 12px; border-radius: 4px; font-weight: 600; margin: 0 0 12px; }
  .sorteios { list-style: none; margin: 10px 0 0; padding: 0; font-size: 15px; }
  .sorteios li { padding: 6px 0; border-bottom: 1px solid var(--linha); }
  .oculto { display: none !important; }
</style>
</head>
<body>

<main class="painel">
  <header class="topo">
    <h1>Área do administrador</h1>
    <p>Lance o resultado da Mega da Caixa. As dezenas são marcadas em todas as cartelas automaticamente.</p>
  </header>

  <section>
    <h2>Acesso</h2>
    <div class="campo" style="margin-bottom:0">
      <label for="senha">Senha do administrador</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="Senha definida no Apps Script">
    </div>
    <p class="aviso">A senha não fica salva: digite de novo sempre que abrir a página.</p>
  </section>

  <section>
    <h2>Lançar resultado</h2>
    <div class="linha2">
      <div class="campo">
        <label for="concurso">Concurso</label>
        <input id="concurso" type="text" inputmode="numeric" maxlength="12" placeholder="Ex.: 2950">
      </div>
      <div class="campo">
        <label for="data">Data do sorteio</label>
        <input id="data" type="date">
      </div>
    </div>

    <div class="cabecalho-grade">
      <label style="margin:0">Dezenas sorteadas</label>
      <span id="contador" class="contador" aria-live="polite">0 de 6</span>
    </div>
    <div id="grade" class="grade" role="group" aria-label="Dezenas de 01 a 60"></div>
    <div class="acoes">
      <button type="button" id="btnLimpar" class="btn">Limpar dezenas</button>
    </div>
    <div style="margin-top:14px">
      <button type="button" id="btnLancar" class="btn principal">Lançar resultado</button>
    </div>
    <p id="msg" class="msg" role="alert"></p>
  </section>

  <section>
    <h2>Sorteios lançados</h2>
    <div id="situacao"></div>
    <ul id="lista" class="sorteios"></ul>
    <div class="acoes">
      <button type="button" id="btnAtualizar" class="btn">Atualizar lista</button>
      <button type="button" id="btnDesfazer" class="btn perigo">Desfazer último sorteio</button>
    </div>
    <p id="msg2" class="msg" role="status"></p>
  </section>
</main>

<script>
/* ============ CONFIGURAÇÃO ============ */
const CONFIG = {
  // Mesma URL (termina em /exec) usada no index.html
  APPS_SCRIPT_URL: "COLE_AQUI_A_URL_DO_APPS_SCRIPT"
};
/* ====================================== */

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const selecionadas = new Set();
const URL_OK = () => /^https:\/\/script\.google\.com\/.+\/exec$/.test(CONFIG.APPS_SCRIPT_URL);

function mostrar(id, texto, tipo) {
  const m = $(id);
  m.textContent = texto;
  m.className = "msg" + (tipo ? " " + tipo : "");
}

/* ---- Grade de 1 a 60 (exatamente 6) ---- */
const grade = $("grade");
for (let n = 1; n <= 60; n++) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dezena";
  b.textContent = pad(n);
  b.dataset.n = n;
  b.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-label", "Dezena " + pad(n));
  b.addEventListener("click", () => {
    if (selecionadas.has(n)) selecionadas.delete(n);
    else if (selecionadas.size < 6) selecionadas.add(n);
    else return mostrar("msg", "Já são 6 dezenas. Desmarque uma para trocar.", "erro");
    atualizar();
  });
  grade.appendChild(b);
}

function atualizar() {
  grade.querySelectorAll(".dezena").forEach((b) => {
    b.setAttribute("aria-pressed", selecionadas.has(Number(b.dataset.n)) ? "true" : "false");
  });
  const c = $("contador");
  c.textContent = selecionadas.size + " de 6";
  c.classList.toggle("cheio", selecionadas.size === 6);
  mostrar("msg", "", "");
}

$("btnLimpar").addEventListener("click", () => { selecionadas.clear(); atualizar(); });

function dataBR(iso) { // "2026-11-04" -> "04/11/2026"
  const p = String(iso || "").split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : "";
}

async function enviar(corpo) {
  const resp = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(corpo)
  });
  const d = await resp.json();
  if (!d.ok) throw new Error(d.erro || "Não foi possível concluir.");
  return d;
}

/* ---- Lançar resultado ---- */
$("btnLancar").addEventListener("click", async () => {
  const senha = $("senha").value;
  const concurso = $("concurso").value.trim();
  if (!URL_OK()) return mostrar("msg", "Configure APPS_SCRIPT_URL no arquivo admin.html.", "erro");
  if (!senha) return mostrar("msg", "Digite a senha do administrador.", "erro");
  if (!concurso) return mostrar("msg", "Informe o número do concurso.", "erro");
  if (selecionadas.size !== 6) return mostrar("msg", "Marque exatamente 6 dezenas (faltam " + (6 - selecionadas.size) + ").", "erro");

  const btn = $("btnLancar");
  btn.disabled = true;
  btn.textContent = "Lançando e marcando as cartelas...";
  mostrar("msg", "", "");
  try {
    const d = await enviar({
      acao: "adicionar_sorteio",
      senha,
      concurso,
      data: dataBR($("data").value),
      dezenas: Array.from(selecionadas).sort((a, b) => a - b)
    });
    const texto = "Sorteio lançado (total: " + d.sorteios + "). " +
      (d.encerrado ? "🏆 Vencedor(es): " + d.vencedores.join(", ") + "." : "Ninguém completou as 10 dezenas ainda.");
    selecionadas.clear();
    $("concurso").value = "";
    atualizar();                    // limpa a grade (e a mensagem)
    mostrar("msg", texto, "ok");    // mostra o resultado depois da limpeza
    carregarLista();
  } catch (e) {
    mostrar("msg", e.message || "Falha de conexão.", "erro");
  } finally {
    btn.disabled = false;
    btn.textContent = "Lançar resultado";
  }
});

/* ---- Lista de sorteios lançados ---- */
async function carregarLista() {
  const ul = $("lista");
  const sit = $("situacao");
  if (!URL_OK()) { sit.textContent = "Configure APPS_SCRIPT_URL no arquivo admin.html."; return; }
  ul.innerHTML = "";
  sit.textContent = "Carregando...";
  try {
    const resp = await fetch(CONFIG.APPS_SCRIPT_URL + "?action=ranking&t=" + Date.now(), { cache: "no-store" });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.erro || "Erro ao carregar.");
    sit.innerHTML = "";

    if (d.encerrado) {
      const nomes = d.lista.filter((r) => r.vencedor).map((r) => r.nome).join(", ");
      const b = document.createElement("p");
      b.className = "banner";
      b.textContent = "🏆 Alguém completou as " + d.totalDezenas + " dezenas! Vencedor(es): " + nomes;
      sit.appendChild(b);
    }
    const info = document.createElement("p");
    info.className = "aviso";
    info.textContent = d.sorteios.length + " sorteio(s) lançado(s) · " + d.lista.length + " participante(s) com pagamento confirmado";
    sit.appendChild(info);

    d.sorteios.forEach((s) => {
      const li = document.createElement("li");
      li.textContent = "Sorteio " + s.numero + (s.concurso ? " · Concurso " + s.concurso : "") +
        (s.data ? " · " + s.data : "") + " — " + s.dezenas.map(pad).join(" ");
      ul.appendChild(li);
    });
  } catch (e) {
    sit.textContent = e.message || "Não foi possível carregar.";
  }
}
$("btnAtualizar").addEventListener("click", carregarLista);

/* ---- Desfazer último sorteio ---- */
$("btnDesfazer").addEventListener("click", async () => {
  const senha = $("senha").value;
  if (!URL_OK()) return mostrar("msg2", "Configure APPS_SCRIPT_URL no arquivo admin.html.", "erro");
  if (!senha) return mostrar("msg2", "Digite a senha do administrador (no topo da página).", "erro");
  if (!window.confirm("Desfazer o ÚLTIMO sorteio lançado? As marcações das cartelas serão recalculadas.")) return;
  try {
    const d = await enviar({ acao: "remover_ultimo_sorteio", senha });
    mostrar("msg2", "Último sorteio removido. Restam " + d.sorteios + ".", "ok");
    carregarLista();
  } catch (e) {
    mostrar("msg2", e.message || "Falha de conexão.", "erro");
  }
});

atualizar();
carregarLista();
</script>
</body>
</html>
